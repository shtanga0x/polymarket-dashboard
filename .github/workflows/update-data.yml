name: Update Polymarket Data

on:
  schedule:
    - cron: '*/5 * * * *'   # fallback; the Cloudflare worker dispatches every 2 min
  repository_dispatch:
    types: [manual-refresh]
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Per-SITE concurrency so a slow/hung watch fetch never blocks core (they used to
    # share one group → a 10-min watch hang froze the whole board). Each site now
    # queues independently.
    concurrency:
      group: update-data-${{ matrix.site }}
      cancel-in-progress: false
    # With proxies a healthy fetch finishes in 1-3 min; 6 catches a hang far sooner
    # than the old 10 while leaving margin. Tighten toward 5 once proxied runs are
    # confirmed fast.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        site: [core, watch]
    env:
      SITE: ${{ matrix.site }}
      SNAPSHOT_ID: ${{ github.run_id }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private trader list
        # The trader list lives in the private repo shtanga0x/polymarket-traders
        # (kept out of this public repo). Pulled via a read-only deploy key
        # (secret TRADERS_DEPLOY_KEY); public repo => Actions minutes stay free.
        uses: actions/checkout@v4
        with:
          repository: shtanga0x/polymarket-traders
          ssh-key: ${{ secrets.TRADERS_DEPLOY_KEY }}
          path: _traders

      - name: Stage trader list into data/
        run: |
          mkdir -p data
          cp _traders/traders.csv data/traders.csv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure R2 upload behaviour
        # The AWS CLI switches to multipart above 8 MB with 8 MB chunks, and
        # trader_portfolios.json sits just over that line (9 MB core, 18 MB
        # watch). Each such upload then costs CreateMultipartUpload + 2-3x
        # UploadPart + CompleteMultipartUpload instead of one PutObject -- all
        # R2 class-A ops, whose included pool is 1M/month. Raising the
        # threshold past the largest object makes every upload a single
        # PutObject. (2026-08-27: this alone was ~479k class-A ops/month.)
        run: |
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.multipart_chunksize 64MB

      - name: Download previous run state from R2
        # Recent-changes diffing and the PnL scrape cache compare against the
        # PREVIOUS run. Files in git are not updated by CI, so the live copies
        # must come down from R2. Missing files (first run) are non-fatal.
        run: |
          mkdir -p "out/$SITE/data"
          for f in aggregated_portfolio.json trader_portfolios.json; do
            aws s3 cp "s3://polymarket-data/$SITE/$f" "out/$SITE/data/$f" \
              --endpoint-url "$R2_ENDPOINT" || echo "No previous $f (first run?)"
          done

      - name: Fetch Polymarket data
        # continue-on-error: a total fetch failure (all proxies down for one cycle)
        # must not fail the run — the next cycle lands in ~2 min and readers keep
        # the previous complete snapshot. Downstream steps are gated on the
        # outcome, so nothing empty is ever uploaded. Sustained outages surface
        # as a stale "last updated" on the board, not as an email per cycle.
        id: fetch
        continue-on-error: true
        run: node scripts/fetch_data.js --site "$SITE"
        env:
          NODE_OPTIONS: '--max-old-space-size=1024'
          # Datacenter proxies for rate-limit avoidance (optional).
          # Format per line: host:port:username:password
          # Set via: gh secret set PROXIES < proxies.txt
          PROXIES: ${{ secrets.PROXIES }}

      - name: Build watermark index
        # Emits wm_offsets.json (byte offsets → the Worker's streaming per-viewer
        # decimal watermark) and wm_marks.json (their {address,field} identities →
        # the offline leak tracer). Non-fatal: if it fails, the Worker just skips
        # watermarking (canary injection still works).
        if: steps.fetch.outcome == 'success'
        run: node scripts/wm_index.js --site "$SITE" || echo "wm_index skipped"

      - name: Upload data to R2 (atomic snapshot, then pointer flip)
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          SRC="out/$SITE/data"
          DST="s3://polymarket-data/$SITE"

          # 1. Immutable snapshot — readers cache these forever. Only the
          #    files the frontend fetches per snapshot; previous_portfolio
          #    and bot_feed are read from flat paths only (saves ~350k R2
          #    class-A ops/month at 1-min cadence — free tier is 1M).
          aws s3 cp "$SRC/" "$DST/snap/$SNAPSHOT_ID/" \
            --recursive --exclude "metadata.json" \
            --exclude "previous_portfolio.json" --exclude "bot_feed.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --checksum-algorithm CRC32 \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Flat copies — previous-state source for the next run, plus the
          #    two files that are only ever read from flat paths.
          #    recent_changes / wm_marks / wm_offsets are NOT copied here: the
          #    frontend fetches them from the snapshot prefix (metadata.snapshot
          #    is always set by fetch_data.js in CI, so the flat fallback in
          #    app.js is only reachable by a stale tab, which recovers on
          #    reload). Writing them once instead of twice saves ~206k R2
          #    class-A ops/month. aggregated_portfolio + trader_portfolios must
          #    stay flat -- the "Download previous run state" step above reads
          #    them from flat paths.
          aws s3 cp "$SRC/" "$DST/" \
            --recursive --exclude "metadata.json" \
            --exclude "recent_changes.json" \
            --exclude "wm_marks.json" \
            --exclude "wm_offsets.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --checksum-algorithm CRC32 \
            --cache-control "public, max-age=60"

          # 3. metadata.json LAST — the atomic pointer flip. Until this lands,
          #    readers keep using the previous complete snapshot.
          aws s3 cp "$SRC/metadata.json" "$DST/metadata.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --checksum-algorithm CRC32 \
            --cache-control "public, max-age=15"

      - name: Prune old snapshots (keep newest 5)
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          # `aws s3 rm --recursive` costs a ListObjects (class A) per snapshot
          # on top of the DeleteObjects. The snapshot file set is fixed and
          # known, so delete the keys directly instead: DeleteObject is free,
          # and only the one outer `ls` stays billable. ~75k class-A ops/month.
          # NOTE: keep SNAP_FILES in sync with the --exclude list in step 1 --
          # a file added to the snapshot but missing here would never be pruned.
          SNAP_FILES="aggregated_portfolio.json trader_portfolios.json recent_changes.json wm_marks.json wm_offsets.json"
          aws s3 ls "s3://polymarket-data/$SITE/snap/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $2}' | tr -d '/' | sort -n | head -n -5 \
            | while read -r old; do
                [ -n "$old" ] || continue
                objs=$(for f in $SNAP_FILES; do
                         printf '{"Key":"%s/snap/%s/%s"},' "$SITE" "$old" "$f"
                       done | sed 's/,$//')
                aws s3api delete-objects --bucket polymarket-data \
                  --delete "{\"Objects\":[$objs],\"Quiet\":true}" \
                  --endpoint-url "$R2_ENDPOINT"
              done
